parameters:
  - name: azureSubscription
    type: string
  - name: applicationName
    type: string
  - name: pathtoArchive
    type: string
  - name: pathtoConfig
    type: string
    default: "$(Pipeline.Workspace)/configuration/host.json"
steps:
  - download: none
  - task: DownloadPipelineArtifact@2
    displayName: "Download: Artifact"
    inputs:
      buildType: "current"
      targetPath: "$(Pipeline.Workspace)"
  - task: replacetokens@6
    displayName: "Replace tokens"
    inputs:
      rootDirectory: "$(Pipeline.Workspace)"
      targetFiles: "**/*.json"
      encoding: "auto"
      writeBOM: true
      actionOnMissing: "warn"
      keepToken: false
      tokenPrefix: "#{"
      tokenSuffix: "}#"
  - task: ArchiveFiles@2
    displayName: "Update: Host File"
    inputs:
      rootFolderOrFile: ${{ parameters.pathtoConfig }}
      includeRootFolder: false
      archiveType: "zip"
      archiveFile: ${{ parameters.pathtoArchive }}
      replaceExistingArchive: false
  - task: AzureKeyVault@2
    displayName: 'AzureKeyVault: Get Secret'
    inputs:
      azureSubscription: '${{ parameters.azureSubscription }}'
      KeyVaultName: '' # KeyVault Name
      SecretsFilter: "*"
      RunAsPreJob: false
  - task: AzureFunctionApp@1
    displayName: "Deploy: Azure Function"
    inputs:
      azureSubscription: "${{ parameters.azureSubscription }}"
      appType: "functionApp"
      appName: ${{ parameters.applicationName }}
      package: ${{ parameters.pathtoArchive }}
      # List of env vars used by application and stored in KeyVault
      appSettings: >
        -FUNCTIONS_EXTENSION_VERSION "~4"
        -FUNCTIONS_WORKER_RUNTIME "dotnet-isolated"
        -MathThreshold "1.0"
        -AzureADSettings:Instance "https://login.microsoftonline.com/{0}"
        -AzureADSettings:Tenant "$(AzureADTenant)"
        -AzureADSettings:ClientId "$(AzureADClientId)"
        -AzureADSettings:ClientSecret "$(AzureADClientSecret)"
        -AzureADSettings:ApiScope "$(AzureADApiScope)"
        -BlobConnection "$(blob-connstring)"
      deploymentMethod: "auto"
